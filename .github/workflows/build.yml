name: Build Yumi

# 触发条件：推送到 main 分支、发布 tag 或手动触发
on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 

      # 2. 配置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          
      # 3. 安装 WebUI 依赖
      - name: Install WebUI dependencies
        working-directory: ./webui
        run: npm install

      # 4. 配置 Rust Nightly + Android 目标
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android
          components: rust-src # build-std 需要

      # 5. 安装 Android NDK
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      # 6. 安装 cargo-ndk
      - name: Setup cargo-ndk
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          cargo install cargo-ndk

      # 7. 【新增】安装 bpf-linker 及系统依赖（LLVM/Clang）
      - name: Install bpf-linker and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          cargo install bpf-linker

      # 8. 运行 xtask 构建（生成最终的 zip 包）
      - name: Run xtask build
        run: cargo xtask build

      # 9. 获取生成的 zip 文件名
      - name: Get Artifact Name
        id: artifact-name
        run: |
          FILE_PATH=$(ls output/*.zip | head -n 1)
          FILE_NAME=$(basename "$FILE_PATH")
          ARTIFACT_NAME="${FILE_NAME%.zip}"
          echo "name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "path=$FILE_PATH" >> $GITHUB_OUTPUT

      # 10. 上传构建产物
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ steps.artifact-name.outputs.path }}
